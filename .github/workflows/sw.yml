name: sw

on:
  push:
  pull_request:
  schedule:
    # every day
    - cron: 0 0 * * *

jobs:
  windows:
    runs-on: windows-2022    
    steps:
    - uses: actions/checkout@v1
    - uses: egorpugin/sw-action@master
    - run: ./sw -static build
    - uses: actions/upload-artifact@v4
      with:
        name: sw-windows
        path: .sw/out/**/*.exe

  linux:
    runs-on: ubuntu-26.04
    container: fedora:latest
    steps:
    - uses: actions/checkout@v1
    - name: prepare
      run: |
        sudo dnf -y update
        sudo dnf -y install flex bison cmake which gcc clang clang-tools-extra lld git perl-File-Find perl-IO-Zlib perl-Compress-Raw-Zlib perl-FindBin perl-IPC-Cmd perl-File-Compare perl-File-Copy
    - uses: egorpugin/sw-action@master
    - run: ./sw -static build -compiler gcc
    - uses: actions/upload-artifact@v4
      with:
        name: sw-linux
        path: .sw/out
                
  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v1
    - uses: egorpugin/sw-action@master
    - name: install
      run: |
        brew update
        brew install flex bison gcc llvm
    - name: build
      run: |
        export PATH="/opt/homebrew/opt/bison/bin:$PATH"
        export PATH="/opt/homebrew/opt/flex/bin:$PATH"
        export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
        export PATH="/opt/homebrew/opt/gcc/bin:$PATH"
        ./sw -static build -compiler appleclang
    - uses: actions/upload-artifact@v4
      with:
        name: sw-macos
        path: .sw/out
